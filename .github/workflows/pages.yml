name: Deploy to GitHub Pages

# 暂时禁用：GitHub Pages 部署服务 Node.js 24 兼容性问题导致部署失败
# 数据推送不受影响，Inoreader 直接从 raw.githubusercontent.com 拉取 XML
# on:
#   push:
#     branches: ["main"]
#   workflow_dispatch:
on: workflow_dispatch

# 设置权限，允许 GITHUB_TOKEN 发布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 限制并发部署：如果有新的推送，取消正在进行的旧部署（避免队列拥堵导致超时报错）
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare for deploy
        run: |
          rm -rf .git .github __pycache__
          touch .nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
